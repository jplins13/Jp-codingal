<!DOCTYPE html>
<html>
    <head>
        <title>
            text shadow
        </title>
        <style>
            *{
                text-align: center;
            }
            #heading1{
                text-shadow: 2px 2px 5px red;
            }
            #heading2{
                box-shadow: 5px 5px 10px blue;
                
                
            }
            #indent{
                text-indent:50px;
            }
        </style>
    </head>
    <body>
        <h1 id="heading1">We Can use text shadow</h1>
        <h2 id="heading2">To add box shadow</h2>
        <div>
            <p>
                Text Indent.

            </p>
<p id="indent">Text Indent.</p>        </div>
    </body>
</html>
