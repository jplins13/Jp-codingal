<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Positioning In Html</title>
        <style>
            .dif{
                right:30px;
                border:3px solid black;

            }
            .div1{
                position:sticky;
                top:1px;
                left:20px;
                width:100px;
                border:3px solid grey;
            
            }
            .div2{
                position:relative;
                left:100px;
                border:3px solid brown;
            }
            .div3{
                position:absolute;
                left:50px;
                border:3px solid orange;
            }
            .div4{
                position:fixed;
                top:0px;
            right:20px;
            width:300px;
            border:3px solid red;
            }
        </style>
        
    </head>
    <body>
        <h1>Positioning in HTML</h1>
        <div class="dif">No Positioning Properties</div>
        <div class="div1">Div with sticky Positioning</div>
        <div class="div2">Div with relative Positioning</div>
        <div class="div3">Div with absolute Positioning</div>
        <div class="div4">Div with fixed Positioning</div>
    </body>
</html>
