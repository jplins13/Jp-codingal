<!DOCTYPE html>
<html>
    <head>
        <title>Animation code</title>
        <style>
            #anim1
             {
                height: 100px;
                width:100px;
                background-color:red;
                animation-name:example;
                animation-duration: 4s;;
            }

            @keyframes example {
                0% {background-color:red; }
                25%{background-color:yellow;}

                50% {background-color:blue;}
                100% {background-color:green;}
            }
        </style>
    </head>
    <body>
        <div id="anim1"></div>
    </body>
