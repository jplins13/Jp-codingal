<!DOCTYPE html>
<html>
    <head>
        <title>
            Bootstrap Jumbotrone
        </title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    </head>
    <body style="text-align: center;">
        <div class="jumbotron  jumbotron-fluid">
            <div class="container">
                <h1>
                    JUMBOTRON
                </h1>
                <p>
                    This is a heading for the jumbotron
                </p>
            </div>
            </div>
            <div class="container mt-3">
                <h2>
                    Buttons Using Bootstrap
                
                </h2>
                <button type="button" class="btn btn-primary">
                    Primary BTN
            
                    
                </button>
                <button type="button" class="btn btn-secondary">Secondary Button </button>
                <button type="button" class="btn btn-success">Success Button </button>
                <button type="button" class="btn btn-warning">Warning Button </button>
                <button type="button" class="btn btn-danger">Danger Button </button>

            </div>
            <div class="container">
                <h1> Badges Bootstrap</h1>
                <span class="badge badge-primary">Primary Badge</span>
                <span class="badge badge-secondary">secondary Badge</span>
                <span class="badge badge-success">Success Badge</span>
                <span class="badge badge-warning">Warning Badge</span>
                <span class="badge badge-danger">Primary Badge</span>
                <span class="badge badge-info">Info Badge</span>
                <span class="badge badge-light">light Badge</span>
                <span class="badge badge-dark"> Dark Badge</span>

                
            </div>
            <div class="container">
                <h1> Progress Bar</h1>
                <div class="progress">
                    <div class="progress-bar" style="width: 60%;">
                            Loading
                    </div>
                </div>
            </div>
    </body>
    
</html>
