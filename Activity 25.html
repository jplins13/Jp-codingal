<!DOCTYPE html>

    <head>

        <title>transparent levels</title>

            div{

                padding:10px;

            }

                opacity:0.1;
            
            }
            .div2{
                opacity:0.3;
            }
            .div3{
                opacity:0.6;
            
            }
            .div4{
                opacity:1;
            }
        </style>
    </head>

        <h1>Transparent Levels</h1>

            <p>Opacity 0.1</p>

        </div><br>
        <div class ="div3">
            <p>Opacity 0.6</p>
            </div><br>
            <div class="div4">

            </div>
            
    </body>
        
</html>
