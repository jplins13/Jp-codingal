<!DOCTYPE html>
<html>
    <head>
        <title>text decoration</title>
        <style>
            
            h1{
                text-decoration:overline;
                text-transform: capitalize;
            }
            h2{
                text-decoration:underline;
                text-transform: uppercase;
            }
            h3{
                text-decoration:line-through;
                text-transform: lowercase;
            }
            h4{
                text-decoration:underline overline;
                text-transform:none;
            }
        </style>
    </head>
    <body>
        <h1>Gradients</h1>
        <h2>What are gradients?</h2>
        <h3>Gradients are a gradual transition between two or more colors. They can be used to create visually appealing backgrounds, buttons, and other design elements on a webpage.</h3>
    <h4>gradients</h4>
       
    </body>
