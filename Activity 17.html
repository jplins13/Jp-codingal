<!DOCTYPE html>
<html
<head>
    <title>typography</title>
    <style>
        .text1{
            color:blue;
            font-size: 20px;
            font-family: cursive, Helvetica, sans-serif;
        }
        .text2{
            color:green;
            font-size: 30px;
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>
<body>
    <h1>Heading 1</h1>
    <p class="text1">This Is my Html Code</p>
    <p class="text2">This Is another paragraph</p>
</body>
